<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News Maker se ha mudado</title>
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ed1470" />
    <!--
      El salto va en la propia etiqueta y no en un script: asi funciona aunque
      el navegador no ejecute nada. Los 2 segundos son para que dé tiempo a leer
      a donde va, y a corregir el marcador.
    -->
    <meta http-equiv="refresh" content="2; url=https://unzak.github.io/taller/news-maker/" />
    <link rel="canonical" href="https://unzak.github.io/taller/news-maker/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff7fb;
        color: #28151f;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
        text-align: center;
      }
      .caja {
        max-width: 34rem;
        padding: 40px 32px;
        background: #fff;
        border: 1px solid #efd5e2;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(117, 35, 73, 0.06);
      }
      h1 { margin: 0 0 12px; font-size: 26px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: #806b76; }
      a.boton {
        display: inline-block;
        padding: 12px 22px;
        background: #ed1470;
        color: #fff;
        border-radius: 999px;
        font-weight: 800;
        text-decoration: none;
      }
      a.boton:hover { background: #c8105e; }
      .pie { margin: 20px 0 0; font-size: 13px; }
      .pie a { color: #806b76; }
    </style>
  </head>
  <body>
    <div class="caja">
      <h1>News Maker se ha mudado</h1>
      <p>
        Ahora vive en el Taller Cabronazi, con las otras dos herramientas.
        Te llevamos en un momento.
      </p>
      <a class="boton" href="https://unzak.github.io/taller/news-maker/">Ir a News Maker</a>
      <p class="pie">
        Actualiza el marcador: <a href="https://unzak.github.io/taller/news-maker/">https://unzak.github.io/taller/news-maker/</a>
      </p>
    </div>
  </body>
</html>
